# Promotes one already-built image (tag sha-<short>) to production: points the
# production app's image variables at it in Coolify, then deploys. Called by CI after
# staging succeeds, and runnable by hand to roll back (Actions > Deploy production >
# Run workflow, with the short sha of an earlier build). See "Deployment" in AGENTS.md.
name: Deploy production

on:
  workflow_call:
    inputs:
      sha:
        description: Commit sha of the images to deploy (full or short)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: Commit sha of the images to deploy (full or the 7-character sha-<short> tag)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # waits for the required reviewer of the `production` environment
    environment: production
    # one production deploy at a time; a newer request replaces one still waiting
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha }}
      OWNER: ${{ github.repository_owner }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::sha must be a commit sha (hex)"; exit 1; }
          for v in COOLIFY_URL COOLIFY_APP_UUID COOLIFY_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::$v is not set on the production environment"; exit 1; }
          done

      - name: Point the production app at these images
        run: |
          owner="${OWNER,,}"
          SHA="${SHA::7}" # the image tag is sha-<7 characters>
          set_env() {
            curl --fail-with-body --silent --show-error --request PATCH \
              "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID/envs" \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"key\": \"$1\", \"value\": \"$2\"}"
            echo
          }
          set_env BACKEND_IMAGE "ghcr.io/$owner/tangostack-backend:sha-$SHA"
          set_env FRONTEND_IMAGE "ghcr.io/$owner/tangostack-frontend:sha-$SHA"

      - name: Deploy
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo
