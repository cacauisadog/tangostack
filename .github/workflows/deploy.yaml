# Deploys the images CI built for one commit to one environment with Kamal
# (deploy/deploy.sh). Called by CI (staging on every push to main, then production),
# and runnable by hand to roll back: Actions > Deploy > Run workflow, with the
# environment and a commit sha. See "Deployment" in AGENTS.md.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        description: Full commit sha of the images to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        required: true
        type: choice
        options: [staging, production]
      sha:
        description: Full commit sha of the images to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # production waits here for its required reviewer
    environment: ${{ inputs.environment }}
    # one deploy per environment at a time; a running one is never cancelled halfway
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # the environment's variables
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      APP_HOST: ${{ vars.APP_HOST }}
      # and secrets (the names deploy/deploy.sh and .kamal/secrets.* expect)
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TLS_CERT: ${{ secrets.TLS_CERT }}
      TLS_KEY: ${{ secrets.TLS_KEY }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the inputs
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be the full 40-character commit sha"; exit 1; }
          for v in DEPLOY_HOST APP_HOST SSH_PRIVATE_KEY SECRET_KEY DATABASE_URL POSTGRES_PASSWORD EMAIL_PASSWORD DEFAULT_FROM_EMAIL TLS_CERT TLS_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is not set on the ${{ inputs.environment }} environment"; exit 1; }
          done
      - name: Install Kamal
        run: |
          gem install kamal --version 2.12.0 --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - name: Deploy
        env:
          SHA: ${{ inputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > "$key")
          export SSH_KEY_FILE="$key"
          ssh-keyscan -t ed25519,rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          deploy/deploy.sh "$ENVIRONMENT" "$SHA"
