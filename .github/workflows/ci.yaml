# Checks on every pull request and push to main. Pushes to main also publish the
# production images to GHCR and ask Coolify to redeploy (see "Deployment" in AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing gets more than read access unless a job asks for it.
permissions:
  contents: read

# A newer push cancels the checks still running for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      # the default DATABASE_URL (postgres:postgres@localhost:5432) is the service above
      - run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the pnpm version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # pnpm 12 links the packages' agent skills here and fails without the directory
      - run: mkdir -p .claude/skills && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  images:
    name: Build and push ${{ matrix.name }}
    # only the main branch publishes; pull requests stop after the checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # registry paths must be lowercase
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :latest is what docker-compose.prod.yaml runs; :sha-... is for rollbacks
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/tangostack-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      # Build once into the local image store and run it before anything is pushed
      # (.github/scripts/smoke-test.sh); the push below reuses these layers.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name }}
          target: prod
          # the VPS is x86; add linux/arm64 here if it ever isn't
          platforms: linux/amd64
          load: true
          tags: smoke/${{ matrix.name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh ${{ matrix.name }} smoke/${{ matrix.name }}:test
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name }}
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy-staging:
    name: Deploy to staging
    needs: images
    # pull requests only run the checks above
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    # two deploys never overlap, and a running one is never cancelled halfway
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Ask Coolify to redeploy
        if: ${{ env.COOLIFY_WEBHOOK != '' }}
        run: |
          curl --fail-with-body --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
      - name: Skipped (no Coolify webhook yet)
        if: ${{ env.COOLIFY_WEBHOOK == '' }}
        run: echo "Set the COOLIFY_WEBHOOK and COOLIFY_TOKEN secrets of the staging environment to deploy."

  # The same images staging just ran, once the `production` environment's reviewer approves.
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yaml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
