# What the backend and the worker have in common.
x-backend-dev: &backend-dev
  build:
    context: ./backend
    target: dev
  image: tangostack-backend:dev
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/tangostack
    CELERY_BROKER_URL: redis://valkey:6379/0
    EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    EMAIL_USE_TLS: "false"
    # only used when OTEL_ENABLED is on (backend/.env); see `make obs`
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  volumes:
    - ./backend:/app
    - ./openapi:/openapi
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6
    container_name: tangostack__postgres
    command: ["postgres", "-c", "log_line_prefix=%m [%p] (%d) %u "]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tangostack
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./dkdata/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tangostack"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The Celery broker (Valkey speaks the Redis protocol). Append-only persistence keeps
  # queued tasks (emails) across restarts.
  valkey:
    image: valkey/valkey:9.1.3
    container_name: tangostack__valkey
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./dkdata/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Catches all outgoing email (SMTP :1025) and shows it at http://localhost:8025.
  # Nothing is ever delivered. The e2e twin has its own ports so tests can empty
  # their inbox without touching the dev one.
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: tangostack__mailpit
    environment:
      # otherwise every connection waits ~8s for a reverse DNS lookup of the client
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck: &mailpit-healthcheck
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit-e2e:
    image: axllent/mailpit:v1.32.0
    container_name: tangostack__mailpit_e2e
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    healthcheck: *mailpit-healthcheck

  # backend, worker and frontend are the `dev` targets of their Dockerfiles: source
  # bind-mounted for live reload, same ports as running them on the host (so
  # Caddy, which reaches the host, works either way; run one or the other).
  backend:
    <<: *backend-dev
    container_name: tangostack__backend
    ports:
      - "127.0.0.1:8000:8000"

  # The Celery worker: the same image and settings as the backend, running tasks (the
  # emails) from Valkey. It also serves a backend running on the host (`make run`),
  # which reaches the same Valkey on localhost. Restarts when Python files change.
  worker:
    <<: *backend-dev
    container_name: tangostack__worker
    command:
      - watchfiles
      - --filter
      - python
      - celery -A tangostack worker -l info --concurrency 2
      - tangostack

  frontend:
    build:
      context: ./frontend
      target: dev
    image: tangostack-frontend:dev
    container_name: tangostack__frontend
    # real backend through Caddy, like `make fe-dev-api`; mocks: VITE_API_MOCKING=true make up
    environment:
      VITE_API_MOCKING: ${VITE_API_MOCKING:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      # the container's own (Linux) dependencies, not the host's
      - frontend_node_modules:/app/node_modules
      # pnpm links package skills here; keep the container's links off the host's
      - frontend_claude_skills:/app/.claude/skills

  caddy:
    image: caddy:2.11.7
    container_name: tangostack__caddy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./dkdata/caddy/data:/data
      - ./dkdata/caddy/config:/config

  # Observability (opt-in: `make obs`). The app sends metrics and logs to the collector
  # (only when OTEL_ENABLED is on), which feeds Prometheus and Loki; Grafana at
  # http://localhost:3001 shows them. Ports are bound to localhost.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: tangostack__otel_collector
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    # needs the Docker socket for container stats
    user: "0"
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: tangostack__prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.7.9
    container_name: tangostack__loki
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:13.3.0
    container_name: tangostack__grafana
    profiles: [observability]
    environment:
      # local only: no login screen
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  frontend_node_modules:
  frontend_claude_skills:
