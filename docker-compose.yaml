services:
  postgres:
    image: postgres:18.6
    container_name: tangostack__postgres
    command: ["postgres", "-c", "log_line_prefix=%m [%p] (%d) %u "]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tangostack
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./dkdata/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tangostack"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Catches all outgoing email (SMTP :1025) and shows it at http://localhost:8025.
  # Nothing is ever delivered. The e2e twin has its own ports so tests can empty
  # their inbox without touching the dev one.
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: tangostack__mailpit
    environment:
      # otherwise every connection waits ~8s for a reverse DNS lookup of the client
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck: &mailpit-healthcheck
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit-e2e:
    image: axllent/mailpit:v1.32.0
    container_name: tangostack__mailpit_e2e
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "1026:1025"
      - "8026:8025"
    healthcheck: *mailpit-healthcheck

  # backend and frontend are the `dev` targets of their Dockerfiles: source
  # bind-mounted for live reload, same ports as running them on the host (so
  # Caddy, which reaches the host, works either way; run one or the other).
  backend:
    build:
      context: ./backend
      target: dev
    image: tangostack-backend:dev
    container_name: tangostack__backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tangostack
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./openapi:/openapi
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    image: tangostack-frontend:dev
    container_name: tangostack__frontend
    # real backend through Caddy, like `make fe-dev-api`; mocks: VITE_API_MOCKING=true make up
    environment:
      VITE_API_MOCKING: ${VITE_API_MOCKING:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # the container's own (Linux) dependencies, not the host's
      - frontend_node_modules:/app/node_modules
      # pnpm links package skills here; keep the container's links off the host's
      - frontend_claude_skills:/app/.claude/skills

  caddy:
    image: caddy:2.11.7
    container_name: tangostack__caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./dkdata/caddy/data:/data
      - ./dkdata/caddy/config:/config

volumes:
  frontend_node_modules:
  frontend_claude_skills:
