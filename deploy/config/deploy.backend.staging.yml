# Staging: its own database, broker and secrets (.kamal/secrets.staging); container names
# already carry the destination. The accessory's name has to differ per destination
# because both live on one host.
accessories:
  db:
    service: tangostack-backend-staging-db
  valkey:
    service: tangostack-backend-staging-valkey

env:
  clear:
    OTEL_ENVIRONMENT: staging
