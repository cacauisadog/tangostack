# Kamal deploy of the Django backend (see "Deployment" in AGENTS.md). One of two
# services on the same host: the frontend (deploy.frontend.yml) answers everything
# the backend doesn't. Destinations (-d staging / -d production) override per
# environment: deploy.backend.<destination>.yml. Images are built and smoke-tested
# by CI, so deploys use `--skip-push --version=<commit sha>`.
service: tangostack-backend
image: <%= ENV.fetch("REGISTRY_OWNER") %>/tangostack-backend

# The container migrates, then serves: kamal-proxy only switches traffic once the new
# container passes its health check, i.e. after the migration finished (the old
# version keeps serving meanwhile, so migrations must stay backward compatible).
# Keep the gunicorn part in sync with the prod stage of backend/Dockerfile.
#
# The worker is the same image running Celery (emails, see "Email delivery" in
# AGENTS.md). It has no proxy, so nothing health-checks it for Kamal: the Docker health
# command below makes `docker ps` / `kamal app details` show whether it answers.
servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: sh -c "python manage.py migrate --noinput && exec gunicorn tangostack.wsgi:application --bind 0.0.0.0:8000 --worker-class gevent --access-logfile -"
  worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: celery -A tangostack worker -l info --concurrency 2 --max-memory-per-child 300000
    proxy: false
    env:
      clear:
        OTEL_SERVICE_NAME: tangostack-worker
    options:
      health-cmd: celery -A tangostack inspect ping -t 5
      health-interval: 30s
      health-timeout: 10s
      health-start-period: 30s

registry:
  server: ghcr.io
  username: <%= ENV.fetch("REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
  keys_only: true
  keys:
    - <%= ENV.fetch("SSH_KEY_FILE") %>

builder:
  arch: amd64

# Same routing as the Caddy router had: these paths go to Django, the rest to the
# frontend. TLS belongs to the root service (the frontend).
proxy:
  host: <%= ENV.fetch("APP_HOST") %>
  app_port: 8000
  path_prefixes:
    - /api
    - /_allauth
    - /accounts
    - /admin
    - /static
  strip_path_prefix: false
  forward_headers: true
  healthcheck:
    path: /api/health
    interval: 2
    timeout: 5

# room for a migration before the first health check passes
deploy_timeout: 180
# stop_timeout is longer than the worker's hard task limit (CELERY_TASK_TIME_LIMIT, 90 s)
# so a deploy never kills a running task; containers that exit at once don't wait for it.
drain_timeout: 30
stop_timeout: 100

env:
  clear:
    BEHIND_PROXY: "true"
    SESSION_COOKIE_SECURE: "true"
    # HSTS, six months, and the CSP enforced (see "Security headers" in AGENTS.md)
    SECURE_HSTS_SECONDS: "15552000"
    CSP_MODE: enforce
    WEB_CONCURRENCY: "2"
    TRUSTED_CLIENT_IP_HEADER: CF-Connecting-IP
    ALLOWED_HOSTS: <%= ENV.fetch("APP_HOST") %>
    CSRF_TRUSTED_ORIGINS: https://<%= ENV.fetch("APP_HOST") %>
    EMAIL_HOST: smtp.resend.com
    EMAIL_USERNAME: resend
    # telemetry to the observability stack (deploy.observability.yml); OTEL_ENVIRONMENT
    # is per destination. Without the stack running, the exporters just drop their data.
    OTEL_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tangostack-observability-otel-collector:4318
  secret:
    - SECRET_KEY
    - DATABASE_URL
    - EMAIL_PASSWORD
    - CELERY_BROKER_URL
    - DEFAULT_FROM_EMAIL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET

# PostgreSQL and Valkey (the Celery broker) run next to the app, on Kamal's docker
# network, reachable only by container name (tangostack-backend-<destination>-db /
# -valkey). Both destinations share that network, hence Valkey's password. Kamal never
# updates the accessories on a deploy. Backups: deploy/backup-db.sh (Postgres only;
# Valkey just holds queued tasks, persisted with AOF in its directory).
accessories:
  db:
    image: postgres:18.6
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: tangostack
        POSTGRES_DB: tangostack
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql
  valkey:
    image: valkey/valkey:9.1.3
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: sh -c 'exec valkey-server --appendonly yes --requirepass "$VALKEY_PASSWORD"'
    env:
      secret:
        - VALKEY_PASSWORD
    directories:
      - valkey:/data
