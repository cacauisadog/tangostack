# Production: its own database, broker and secrets (.kamal/secrets.production); container names
# already carry the destination. The accessory's name has to differ per destination
# because both live on one host.
accessories:
  db:
    service: tangostack-backend-production-db
  valkey:
    service: tangostack-backend-production-valkey

env:
  clear:
    OTEL_ENVIRONMENT: production
