# Production stack (Coolify: Docker Compose build pack). Not for local development:
# `docker-compose.yaml` is that. Everything here is configured through environment
# variables; `${VAR:?}` ones must be set or the deploy stops.
#
# - Images come from the registry (built by CI); this file never builds.
# - PostgreSQL is not here: it is a Coolify database resource (scheduled backups),
#   reached through the destination's predefined network. See "Deployment" in AGENTS.md.
# - `router` is the only service the platform's proxy talks to: give it the domain
#   in Coolify (port 80). It sends /api, /_allauth, /accounts, /admin and /static
#   to Django and everything else to the frontend (deploy/Caddyfile).

services:
  router:
    image: caddy:2.11.7
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  # The migration runs to completion before the backend starts. If Coolify reports
  # the app as unhealthy because this container exited, add `exclude_from_hc: true`
  # here (a Coolify-only key that plain `docker compose` rejects, so not committed).
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/cacauisadog/tangostack-backend:latest}
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/cacauisadog/tangostack-backend:latest}
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      # comma separated: the public host(s), e.g. treinor.com.br
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
      # comma separated origins with the scheme, e.g. https://treinor.com.br
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
      # TLS ends at the platform's proxy, which sends X-Forwarded-Proto
      BEHIND_PROXY: "true"
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
      # gunicorn's worker count
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Email through the provider's SMTP. Defaults: STARTTLS on 587. For implicit
      # TLS (465) set EMAIL_PORT=465, EMAIL_USE_SSL=true and EMAIL_USE_TLS=false.
      EMAIL_HOST: ${EMAIL_HOST:?}
      EMAIL_USERNAME: ${EMAIL_USERNAME:?}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?}
      EMAIL_PORT: ${EMAIL_PORT:-0}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      # an address on a domain the provider has verified (SPF/DKIM/DMARC)
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
      # optional: Google login is hidden without both
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      # the image has no curl; /api/health also checks the database
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/cacauisadog/tangostack-frontend:latest}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
