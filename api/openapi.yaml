openapi: 3.1.0
info:
  title: Tangostack API
  version: 0.1.0
  description: |
    Contract-first API. Defined by the frontend first, mocked with MSW, then
    implemented by the backend. See AGENTS.md for the workflow.

servers:
  - url: /

tags:
  - name: lists
  - name: todos

paths:
  /api/lists:
    get:
      operationId: listLists
      tags: [lists]
      summary: List all to-do lists with their todos
      responses:
        "200":
          description: All lists, in creation order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoList"
    post:
      operationId: createList
      tags: [lists]
      summary: Create a to-do list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTodoList"
      responses:
        "201":
          description: The created list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/lists/{listId}/todos:
    post:
      operationId: createTodo
      tags: [todos]
      summary: Add a todo to a list
      parameters:
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTodo"
      responses:
        "201":
          description: The created todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/todos/{todoId}:
    patch:
      operationId: updateTodo
      tags: [todos]
      summary: Update a todo (mark done or undone)
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoUpdate"
      responses:
        "200":
          description: The updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TodoId:
      name: todoId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Todo:
      type: object
      required: [id, text, done]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
        done:
          type: boolean
    TodoList:
      type: object
      required: [id, name, todos]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
    NewTodoList:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    NewTodo:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
    TodoUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
