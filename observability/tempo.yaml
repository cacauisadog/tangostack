# Single-process Tempo on the local filesystem: enough for one small host (dev and the
# Kamal stack alike). Receives spans from the collector over OTLP/gRPC. Retention: 24h
# here; the Kamal stack sets TEMPO_BLOCK_RETENTION (needs -config.expand-env=true).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: ${TEMPO_BLOCK_RETENTION:-24h}
