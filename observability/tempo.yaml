# Single-process Tempo on the local filesystem: enough for one small host (dev and the
# Kamal stack alike). Receives spans from the collector over OTLP/gRPC. Retention: 24h
# here; the Kamal stack mounts a copy with a longer one.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 24h
