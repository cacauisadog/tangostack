# The part of the collector that is the same everywhere: receives the app's metrics and
# logs over OTLP/HTTP, batches, and exports metrics to Prometheus (which scrapes :8889)
# and logs to Loki. It is merged with an overlay that adds what the stack has to collect
# and defines the metrics pipelines: otel-collector.dev.yaml (docker compose) or
# otel-collector.prod.yaml (Kamal):  --config=<this file> --config=<overlay>
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
