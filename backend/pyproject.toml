[project]
name = "tangostack"
version = "0.1.0"
description = "TanStack Start + Django"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "dj-database-url>=3.1.2",
  "django>=6.1.2",
  "django-allauth[headless,socialaccount]>=65.20.1",
  "django-extensions>=4.1",
  "django-ninja>=1.7.1",
  "gunicorn[gevent]>=26.2.0",
  "ipdb>=0.13.13",
  "ipython>=9.17.1",
  "psycopg[binary]>=3.3.6",
  "python-decouple>=3.8",
]

[dependency-groups]
dev = [
  "coverage>=7.16.2",
  "django-silk>=5.6.0",
  "django-stubs>=6.1.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.1",
]
